name: Check Version

on:
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Show properties file (debug)
        run: cat application.properties

      - name: Read version from application.properties
        run: |
         VERSION=$(grep '^api-version=' application.properties | cut -d'=' -f2)
         echo "V is $VERSION"
         echo "VERSION=$VERSION" >> $GITHUB_ENV
         
      - run: echo "Version from file is ${{ env.VERSION }}"

