name: Test -CI

on:
  workflow_dispatch:

permissions:
  contents: write 
jobs:
  display:
    runs-on: ubuntu-latest
    environment: PPE
      
    steps:
     - name: Checkout repository
       uses: actions/checkout@v4
     - name: Display the env name
       run: | 
          echo "name is ${{ vars.USERNAME }}"
          echo "password is ${{ secrets.PASSWORD }}"
          echo "${{ vars.USERNAME }}" | base64 
          echo "password is ${{ secrets.PASSWORD }}"

     - name: Get current date and time
       run: |
          IST_DATE=$(TZ=Asia/Kolkata date '+%Y-%m-%d_%H-%M-%S')
          echo "CURRENT_DATE=$IST_DATE" >> $GITHUB_ENV

     - name: Show the date
       run: echo "The current date and time is $CURRENT_DATE"
     - name: Set image tag with date and commit
       id: vars
       run: |
          DATE=$(date +'%Y%m%d')
          COMMIT_ID=$(git rev-parse --short HEAD)
          ENV_NAME=dev   # or use ${{ vars.ENV_NAME }}
          IMAGE_TAG="${DATE}-${COMMIT_ID}-${ENV_NAME}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "The latest build is $IMAGE_TAG" > docker_image_tag.txt
          echo "Tag name is $IMAGE_TAG" 
     - name: Commit tag file back to repo
       run: |
          echo "The env name is ${{ env.IMAGE_TAG }}"
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git pull origin testing--CI
          git add docker_image_tag.txt
          git commit -m "Add latest image tag: $IMAGE_TAG" || echo "No changes to commit"
          git push
